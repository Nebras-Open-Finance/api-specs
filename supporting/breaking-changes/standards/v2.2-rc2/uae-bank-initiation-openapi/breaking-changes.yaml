# Accepted breaking changes introduced in this version of the spec.
#
# Each entry is matched against oasdiff's ERR-level output. An entry is
# considered matching if its `rule` (or any of its `rules`) matches AND any
# of its `endpoints` matches the (method, path) of the change. Matched
# changes are filtered out before the test asserts.
#
# Format:
#   - rule: <oasdiff rule code>   # or `rules: [a, b, c]` for multiple
#     endpoints:
#       - method: GET
#         path: /some/path/{Param}
#     signedOffBy: Name - Role, Org
#     rationale: |
#       Free text written from the perspective of the change author,
#       explaining what changed, why, and the impact on consumers.

- rules:
    - response-property-type-changed
    - request-property-all-of-added
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    Every date-time field now expresses its type through the shared `AEDateTime`
    Schema Object instead of repeating `type: string` / `format: date-time`
    inline. A field that carries its own description becomes an `allOf` of
    `AEDateTime` and a description-only subschema; a field whose description said
    nothing beyond the encoding boilerplate becomes a plain `$ref`. Per OFP-014.

    OFP-014 exists because the specs described the encoding of a date-time and
    never said that the value identifies an instant. Nothing in the ecosystem
    catches an implementation that reads `2027-07-22T00:00:00Z` as local
    midnight: the value is well formed, the API Hub stores it unchanged, and the
    receiving system records a time four hours adrift. That has already failed a
    live integration, where a correctly formed UTC consent expiry was read as
    local time and short-window consents arrived already expired. `AEDateTime`
    states the missing semantics once — the offset is part of the value, the
    recipient must apply it, and two encodings of the same instant must behave
    identically — in place of ~20 near-identical field descriptions.

    oasdiff reports this as a type change because it does not merge `allOf`
    before comparing: with `type` and `format` now reached through the
    reference, it reads the composed type as empty and the added reference as a
    new `allOf` member. The effective schema is unchanged. Every field is still
    `type: string` with `format: date-time`, and every value that validated
    before still validates, apart from the two forms the pattern now rejects
    (recorded separately below).

    Impact on TPPs: none. The wire format does not change, and a consumer
    that resolves `$ref` and `allOf` — as any OpenAPI tooling must — sees the
    same type it saw before. A consumer that generates code from the document
    may see the field emitted through a shared date-time type rather than a
    per-field one.

- rule: request-property-pattern-added
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    `AEDateTime` carries a `pattern` that requires an offset and forbids the
    negative zero offset `-00:00`. Per OFP-014, enforcement option 1.

    The prose in `AEDateTime` says the offset is mandatory and that `-00:00`
    must not be used; the pattern is what makes those two statements testable
    rather than advisory. Every other offset stays conformant, so
    `2027-07-22T00:00:00Z`, `2027-07-22T00:00:00.123456Z` and
    `2027-07-22T04:00:00+04:00` are all accepted, and only
    `2027-07-22T00:00:00-00:00` and an offset-less `2027-07-22T00:00:00` are
    rejected. Requiring UTC outright — which would also reject `+04:00` — is the
    breaking change OFP-014 defers to a major version, and is not made here.

    Acceptance rationale: the migration cost is close to zero. `-00:00` is
    prohibited by RFC 3339 for exactly the reason OFP-014 cares about (it
    declares the offset unknown, which is meaningless for an instant), and no
    producer in the ecosystem is known to emit it. A value with no offset at all
    was already non-conformant under the existing prose — "all date-time fields
    in responses must include the timezone" — so the pattern enforces a rule the
    standard already stated rather than introducing one.

    Impact: a producer emitting `-00:00`, or omitting the offset, is now
    rejected at the schema rather than silently accepted and misread downstream.
    Emitting `Z` or `+00:00` instead is a one-line change and is what the
    standard already asked for.

- rules:
    - request-property-type-changed
    - response-property-type-changed
  endpoints:
    - method: GET
      path: /payment-consents
    - method: GET
      path: /payment-consents/{ConsentId}
    - method: PATCH
      path: /payment-consents/{ConsentId}
    - method: GET
      path: /payment-consents/{ConsentId}/attestations
    - method: POST
      path: /payment-consents/{ConsentId}/attestations
    - method: GET
      path: /payment-consents/{ConsentId}/refund
    - method: POST
      path: /payment-consents/{ConsentId}/file
    - method: POST
      path: /payments
    - method: GET
      path: /payments
    - method: GET
      path: /payments/{PaymentId}
    - method: POST
      path: /file-payments
    - method: GET
      path: /file-payments
    - method: GET
      path: /file-payments/{PaymentId}
    - method: GET
      path: /file-payments/{PaymentId}/report
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    The `aud` claim of every signed message on this API is redefined from
    `type: array, items: type: string` to `type: string`. This is a
    clarification, not a change in behaviour: the API Hub only sends `aud`
    as a single string, and the spec now matches it. It extends
    v2.1-errata2 entry #5, which made the same correction to
    uae-confirmation-of-payee-openapi, to the rest of the standards.

    Affected: the shared `AEJwt` schema (inherited by every `*Signed` request
    and response wrapper), `AECreateTPPAttestationSigned1Request` and
    `AETPPAttestationSigned1Response`. The `Error400BadRequestSigned`,
    `Error403ForbiddenSigned` and `Error500InternalServerErrorSigned`
    examples now show `aud` as a string.

    The descriptions now name the one recipient each message is addressed to:
    - on a request, the API Hub authorisation server's issuer identifier for
      the LFI (`https://auth1.[LFICode].apihub.openfinance.ae`);
    - on a response, the `client_id` of the TPP that made the request.

    Every signed message on this API has exactly one recipient, and
    RFC 7519 §4.1.3 permits `aud` to be a single StringOrURI when the JWT
    has one audience.

    Impact: none for consumers integrated against the wire format, which
    already carries a string. A consumer that strictly validated against the
    array-only contract could not have decoded real API Hub traffic, so no
    such consumer exists in working form.

- rules:
    - request-parameter-type-changed
    - request-property-type-changed
    - response-property-type-changed
  endpoints:
    - method: GET
      path: /payment-consents
    - method: GET
      path: /payment-consents/{ConsentId}
    - method: PATCH
      path: /payment-consents/{ConsentId}
    - method: GET
      path: /payment-consents/{ConsentId}/attestations
    - method: POST
      path: /payment-consents/{ConsentId}/attestations
    - method: GET
      path: /payment-consents/{ConsentId}/refund
    - method: POST
      path: /payment-consents/{ConsentId}/file
    - method: POST
      path: /payments
    - method: GET
      path: /payments/{PaymentId}
    - method: POST
      path: /file-payments
    - method: GET
      path: /file-payments/{PaymentId}
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    `format: uuid` is added to every consent identifier on this API that did
    not already carry it: the `ConsentId` path parameter, the
    `baseConsentId` query parameter, and
    `AEPushedAuthorizationRequests.AEConsentId` and
    `AEPushedAuthorizationRequests.AEBaseConsentId` (the consent returned by
    `GET /payment-consents`, `GET /payment-consents/{ConsentId}` and
    `GET /payment-consents/{ConsentId}/refund`, and `Data.ConsentId` on the
    `/payments` and `/file-payments` requests and responses). The
    `x-consent-id` header on `POST /payments` was already `format: uuid`.

    A ConsentId is only ever created by the TPP in the Pushed Authorization
    Request, where `ConsentId` and `BaseConsentId` on `POST /par` are
    already declared `format: uuid`. Every ConsentId these operations carry
    originated there, so the change describes the same identifier the same
    way across the authorisation, consent and resource APIs. `type`,
    `minLength` and `maxLength` are unchanged.

    Impact: none for a TPP that follows the `/par` contract. The ConsentId it
    created there is already a UUID, and it is the only value these
    operations can refer to.

- rules:
    - api-path-removed-without-deprecation
    - api-removed-without-deprecation
  endpoints:
    - method: POST
      path: /payment-consents/{ConsentId}/file
    - method: POST
      path: /file-payments
    - method: GET
      path: /file-payments
    - method: GET
      path: /file-payments/{PaymentId}
    - method: GET
      path: /file-payments/{PaymentId}/report
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    Per OFP-001 (approved, decision record DR-2026-001), Bulk/Batch Payments
    carry the payments as a JSON array instead of an uploaded file.

    `POST /payment-consents/{ConsentId}/file` is removed: there is no longer
    a file to upload. The `200NoContent` response, used only by this
    operation, is removed with it.

    The `/file-payments` endpoints move to `/bulk-payments`, as the resource
    is no longer a file, and mirror the single-payment endpoints:
    `POST /bulk-payments`, `GET /bulk-payments` (lookup by
    `x-idempotency-key`) and `GET /bulk-payments/{BulkPaymentId}`. Their
    operation IDs move with them (`CreateBulkPayment`,
    `QueryBulkPaymentResource` and `RetrieveBulkPayment`). The path
    parameter is `BulkPaymentId`, as each payment within a Bulk/Batch
    Payment now has its own `PaymentId`. A single payment within a
    Bulk/Batch Payment can be read with
    `GET /bulk-payments/{BulkPaymentId}/payments/{PaymentId}`, which is an
    addition. `GET /file-payments/{PaymentId}/report`, which returned the execution
    report as a file, is removed with no replacement: the status of each
    payment is read from `GET /bulk-payments/{BulkPaymentId}`, as a single
    payment's is read from `GET /payments/{PaymentId}`. oasdiff reports each
    old path as removed; the new paths are additions.

    The response (`AEFilePaymentIdResponse`) carries only
    `Data.BulkPaymentId`, in place of `Data.PaymentId`, `Data.ConsentId`,
    `Data.CreationDateTime` and a required `Data.Instructions` array, with
    one `AEFilePaymentInstructionResponse` per payment, in request order.
    Each element carries the payment's own `PaymentId`, `Status`
    (`AEPaymentStatus`), `StatusUpdateDateTime`, `PaymentRail`,
    `PaymentTransactionId` and `RejectReasonCode`, the fields the LFI
    updates on a single payment, with its `Amount`, `PaymentPurposeCode`,
    `DebtorReference` and `CreditorReference`. The Bulk/Batch Payment as a
    whole carries no `Status`, `StatusUpdateDateTime`, `PaymentRail`,
    `RejectReasonCode`, `Charges`, `Instruction` (the consent control
    parameters), `PaymentPurposeCode` or `OpenFinanceBilling`. The
    `AEFilePaymentStatus`, `AEServiceInitiationOpenFinanceFilePaymentBilling`
    and `AEPushedAuthorizationRequests.AEBankServiceInitiationBulkBatchPaymentConsent`
    schemas, used only by those fields, are removed.

    The `POST /bulk-payments` request (`AEFilePaymentRequest`) carries
    `ConsentId`, a required `Instructions` array with one
    `AEFilePaymentInstruction` per payment and at most 500 payments
    (`maxItems: 500`, also on the response's `Instructions`), and
    `Data.PersonalIdentifiableInformation`, which carries the Bulk and Batch
    Risk block (`AEBulkBatchPaymentRisk`) once for the whole Bulk/Batch
    Payment (`AEBankServiceInitiation.AEFilePaymentRiskPIIProperties`). It
    carries no `OpenFinanceBilling`. Each instruction carries its own
    `Amount`, `PaymentPurposeCode`, `DebtorReference`, `CreditorReference`
    and `PersonalIdentifiableInformation`, whose decoded form
    (`AEBankServiceInitiation.AEFilePaymentPIIProperties`) holds a required
    `DebtorAccount`, as the payments may be made from different accounts,
    and the Creditor, without `ConfirmationOfPayeeResponse`. The file-era
    `Data.Instruction` and the top-level `PaymentPurposeCode` and
    `DebtorReference` are gone.

    The endpoints are removed rather than deprecated because they have never
    been used. No LFI in the ecosystem has implemented File Payments, so
    there is no live integration and no TPP can have called them
    successfully.

    Impact: none in production. A TPP building Bulk/Batch Payments against
    v2.2 builds against `/bulk-payments` from the start.

- rules:
    - response-required-property-removed
    - response-optional-property-removed
  endpoints:
    - method: GET
      path: /payment-consents
    - method: GET
      path: /payment-consents/{ConsentId}
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    The `FilePayment` control parameters on the consent
    (`AEBankServiceInitiationRichAuthorizationRequests.AEBankServiceInitiationBulkBatchPaymentConsent`)
    lose `FileType`, `FileHash` and `FileReference`, as there is no file to
    type, hash or reference, and lose `RequestedExecutionDate`. They gain a
    required `Description`, the reason shown to the User at authorization.
    `NumberOfTransactions` is kept. `ControlSum` is renamed
    `TotalValueOfPayments` and becomes an
    `AEStandardModels.AEAmountAndCurrency` object (`Amount` and `Currency`),
    the type `SinglePayment.Amount` uses. The object is returned by
    `GET /payment-consents` and `GET /payment-consents/{ConsentId}`.

    Acceptance rationale: no LFI has implemented File Payments, so there is
    no live consent, payment or integration to migrate. OFP-001 was approved
    on that basis, before any LFI builds the file-parsing and
    malware-scanning pipelines the file model would have needed.

    Impact: none in production. A TPP building Bulk/Batch Payments against
    v2.2 builds the array model from the start.

- rules:
    - response-required-property-removed
    - response-optional-property-removed
    - response-property-type-changed
    - response-property-one-of-added
    - response-body-one-of-added
  endpoints:
    - method: GET
      path: /payment-consents
    - method: GET
      path: /payment-consents/{ConsentId}
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    The Bank Service Initiation consent returned by `GET /payment-consents` and
    `GET /payment-consents/{ConsentId}` becomes a `oneOf` of two shapes,
    identified by structure alone, with no new field to discriminate them. The
    Bulk/Batch Payment shape is the one being worked on; the Domestic or
    International Payment shape keeps the consent as it was for now.

    - Bulk/Batch Payment: `ControlParameters.ConsentSchedule` carries only
      a required `BulkBatchPayment` (formerly `FilePayment`), and
      `ControlParameters` carry no `IsDelegatedAuthentication`.
      `Permissions`, `CurrencyRequest`, `PaymentPurposeCode`,
      `DebtorReference` and `CreditorReference` are not carried, as each
      payment carries its own, and the consent as returned carries no
      `OpenFinanceBilling`. `NumberOfTransactions` has a `maximum` of
      500, as a Bulk and Batch Payment carries at most 500 payments.
    - Domestic or International Payment: the consent as before, with
      `FilePayment` removed from its `ConsentSchedule`.

    oasdiff reads the move of the consent's properties into the `oneOf` branches
    as their removal from the consent, and the `oneOf` itself as an addition.
    For single payments the effective contract is unchanged: every consent that
    validated before, other than one carrying `FilePayment`, validates against
    the Domestic or International Payment shape.

    Acceptance rationale: the only consents that no longer validate are ones
    carrying `FilePayment`, and no LFI has implemented File Payments.

    Impact: none in production.

- rules:
    - response-property-became-optional
  endpoints:
    - method: POST
      path: /payments
    - method: GET
      path: /payments/{PaymentId}
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    `Data.OpenFinanceBilling` on `AEPaymentIdResponse`, the response of
    `POST /payments` and `GET /payments/{PaymentId}`, is no longer required,
    per OFP-001 (approved, decision record DR-2026-001).

    `GET /payments/{PaymentId}` now also returns a single payment within a
    Bulk/Batch Payment, by the `PaymentId` returned for it on
    `POST /bulk-payments`, in the single-payment shape. Such a payment
    carries no `OpenFinanceBilling`, as a Bulk/Batch Payment carries none, so
    the property cannot be required for it. Its `Instruction.Amount`,
    `PaymentPurposeCode` and `DebtorReference` are those of the payment, and
    `ConsentId` is the Bulk/Batch Payment's consent.

    For a payment made on `POST /payments` nothing changes: the response
    description states that `OpenFinanceBilling` is present for every such
    payment, as before.

    Acceptance rationale: the property is absent only for a payment within a
    Bulk/Batch Payment, and no LFI has implemented Bulk/Batch Payments, so no
    TPP receives such a payment today.

    Impact: none in production. A TPP reading a single payment keeps
    receiving `OpenFinanceBilling`.
