# Accepted breaking changes introduced in this version of the spec.
#
# Each entry is matched against oasdiff's ERR-level output. An entry is
# considered matching if its `rule` (or any of its `rules`) matches AND any
# of its `endpoints` matches the (method, path) of the change. Matched
# changes are filtered out before the test asserts.
#
# Format:
#   - rule: <oasdiff rule code>   # or `rules: [a, b, c]` for multiple
#     endpoints:
#       - method: GET
#         path: /some/path/{Param}
#     signedOffBy: Name - Role, Org
#     rationale: |
#       Free text written from the perspective of the change author,
#       explaining what changed, why, and the impact on consumers.

- rules:
    - new-required-request-property
    - request-property-removed
  endpoints:
    - method: POST
      path: /consent/actions/augment
    - method: POST
      path: /consent/actions/validate
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    The Bulk/Batch Payment control parameters on the consent
    (`OzoneConnectConsentEventActionAPIs.AEServiceInitiationBulkBatchPaymentConsent`,
    at `ControlParameters.ConsentSchedule.FilePayment`) are revised for the
    JSON-array model, per OFP-001 (approved, decision record DR-2026-001).
    `FileType`, `FileHash` and `FileReference` are removed, as there is no
    file to type, hash or reference, and `RequestedExecutionDate` is removed.
    A required `Description` is added: the reason the LFI shows the User at
    authorization. `NumberOfTransactions` is kept. `ControlSum` is renamed
    `TotalValueOfPayments` and becomes an
    `OzoneConnectConsentEventActionAPIs.AEAmountAndCurrency` object (`Amount`
    and `Currency`), the type `SinglePayment.Amount` uses.

    Acceptance rationale: no LFI has implemented File Payments, so no LFI
    receives a File Payment consent on these operations today.

    Impact: none in production.

- rules:
    - request-property-removed
    - request-property-type-changed
    - request-property-one-of-added
    - request-body-one-of-added
    - new-required-request-property
    - request-property-became-required
    - request-property-max-set
  endpoints:
    - method: POST
      path: /consent/actions/augment
    - method: POST
      path: /consent/actions/validate
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    The Bank Service Initiation consent
    (`OzoneConnectConsentEventActionAPIs.AEServiceInitiationAuthorizationDetailProperties`
    and `OzoneConnectConsentEventActionAPIs.AEPaymentConsentResponse.Data`)
    becomes a `oneOf` of two shapes, identified by structure alone, with no new
    field to discriminate them. The Bulk/Batch Payment shape is the one being
    worked on; the Domestic or International Payment shape keeps the consent as
    it was for now.

    - Bulk/Batch Payment: `ControlParameters.ConsentSchedule` carries only
      a required `BulkBatchPayment` (formerly `FilePayment`), and
      `ControlParameters` carry no `IsDelegatedAuthentication`.
      `Permissions`, `CurrencyRequest`, `PaymentPurposeCode`,
      `DebtorReference` and `CreditorReference` are not carried, as each
      payment carries its own, and the consent as returned carries no
      `OpenFinanceBilling`. `NumberOfTransactions` has a `maximum` of
      500, as a Bulk and Batch Payment carries at most 500 payments.
      The PII decodes to `AEBulkBatchPaymentPII`, which carries only the
      Bulk and Batch Risk block, `AEBulkBatchPaymentRisk`.
    - Domestic or International Payment: the consent as before, with
      `FilePayment` removed from its `ConsentSchedule`.

    This spec did not set `additionalProperties: false` on the consent or its
    `ConsentSchedule`. Each branch, and the Domestic or International
    `ConsentSchedule`, now sets it, as without it a Bulk/Batch Payment consent
    would also match the Domestic or International shape. The API Hub's own
    Consent Manager schemas already set it, so nothing the API Hub sends carries
    properties outside these shapes.

    oasdiff reads the move of the consent's properties into the `oneOf` branches
    as their removal from the consent, and the `oneOf` itself as an addition.
    For single payments the effective contract is unchanged: every consent that
    validated before, other than one carrying `FilePayment`, validates against
    the Domestic or International Payment shape.

    Acceptance rationale: the only consents that no longer validate are ones
    carrying `FilePayment`, and no LFI has implemented File Payments.

    Impact: none in production.
