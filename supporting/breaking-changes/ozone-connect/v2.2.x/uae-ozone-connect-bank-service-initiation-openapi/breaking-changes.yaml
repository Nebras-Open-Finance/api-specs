# Accepted breaking changes introduced in this version of the spec.
#
# Each entry is matched against oasdiff's ERR-level output. An entry is
# considered matching if its `rule` (or any of its `rules`) matches AND any
# of its `endpoints` matches the (method, path) of the change. Matched
# changes are filtered out before the test asserts.
#
# Format:
#   - rule: <oasdiff rule code>   # or `rules: [a, b, c]` for multiple
#     endpoints:
#       - method: GET
#         path: /some/path/{Param}
#     signedOffBy: Name - Role, Org
#     rationale: |
#       Free text written from the perspective of the change author,
#       explaining what changed, why, and the impact on consumers.

- rules:
    - response-property-type-changed
    - request-property-type-changed
    - request-property-all-of-added
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    Every date-time field now expresses its type through the shared `AEDateTime`
    Schema Object instead of repeating `type: string` / `format: date-time`
    inline. A field that carries its own description becomes an `allOf` of
    `AEDateTime` and a description-only subschema; a field whose description said
    nothing beyond the encoding boilerplate becomes a plain `$ref`. Per OFP-014.

    OFP-014 exists because the specs described the encoding of a date-time and
    never said that the value identifies an instant. Nothing in the ecosystem
    catches an implementation that reads `2027-07-22T00:00:00Z` as local
    midnight: the value is well formed, the API Hub stores it unchanged, and the
    receiving system records a time four hours adrift. That has already failed a
    live integration, where a correctly formed UTC consent expiry was read as
    local time and short-window consents arrived already expired. `AEDateTime`
    states the missing semantics once — the offset is part of the value, the
    recipient must apply it, and two encodings of the same instant must behave
    identically — in place of ~20 near-identical field descriptions.

    oasdiff reports this as a type change because it does not merge `allOf`
    before comparing: with `type` and `format` now reached through the
    reference, it reads the composed type as empty and the added reference as a
    new `allOf` member. The effective schema is unchanged. Every field is still
    `type: string` with `format: date-time`, and every value that validated
    before still validates, apart from the two forms the pattern now rejects
    (recorded separately below).

    Impact on LFIs: none. The wire format does not change, and a consumer
    that resolves `$ref` and `allOf` — as any OpenAPI tooling must — sees the
    same type it saw before. A consumer that generates code from the document
    may see the field emitted through a shared date-time type rather than a
    per-field one.

- rule: request-property-pattern-added
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    `AEDateTime` carries a `pattern` that requires an offset and forbids the
    negative zero offset `-00:00`. Per OFP-014, enforcement option 1.

    The prose in `AEDateTime` says the offset is mandatory and that `-00:00`
    must not be used; the pattern is what makes those two statements testable
    rather than advisory. Every other offset stays conformant, so
    `2027-07-22T00:00:00Z`, `2027-07-22T00:00:00.123456Z` and
    `2027-07-22T04:00:00+04:00` are all accepted, and only
    `2027-07-22T00:00:00-00:00` and an offset-less `2027-07-22T00:00:00` are
    rejected. Requiring UTC outright — which would also reject `+04:00` — is the
    breaking change OFP-014 defers to a major version, and is not made here.

    Acceptance rationale: the migration cost is close to zero. `-00:00` is
    prohibited by RFC 3339 for exactly the reason OFP-014 cares about (it
    declares the offset unknown, which is meaningless for an instant), and no
    producer in the ecosystem is known to emit it. A value with no offset at all
    was already non-conformant under the existing prose — "all date-time fields
    in responses must include the timezone" — so the pattern enforces a rule the
    standard already stated rather than introducing one.

    Impact: a producer emitting `-00:00`, or omitting the offset, is now
    rejected at the schema rather than silently accepted and misread downstream.
    Emitting `Z` or `+00:00` instead is a one-line change and is what the
    standard already asked for.

- rules:
    - api-path-removed-without-deprecation
    - api-removed-without-deprecation
  endpoints:
    - method: POST
      path: /payment-consents
    - method: POST
      path: /payment-consents/{consentId}/file
    - method: GET
      path: /payments/{paymentId}/report-file
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    `POST /payment-consents` and `POST /payment-consents/{consentId}/file`
    are removed, per OFP-001 (approved, decision record DR-2026-001). Both
    existed only for the file model: the API Hub created the File Payment
    consent at the LFI and then passed the uploaded payment file through, so
    that the LFI could validate the file before the User authorized the
    consent. Bulk/Batch Payments now carry the payments as a JSON array on
    `POST /bulk-payments` (recorded below), so there is no file to pass
    through.

    `GET /payments/{paymentId}/report-file` is removed with them. It served
    the Standards Bulk/Batch Payment report, which returned the execution
    report as a file and is itself removed: the status of each payment in a
    Bulk/Batch Payment is now read from the Bulk/Batch Payment, as a single
    payment's is.

    The operations are removed rather than deprecated because no LFI has
    implemented File Payments.

    Impact: none in production.

- rules:
    - request-property-one-of-removed
    - request-body-one-of-removed
    - request-property-all-of-added
    - request-property-type-changed
    - request-property-removed
    - new-required-request-property
  endpoints:
    - method: POST
      path: /payments
  signedOffBy: Thomas Catchpole - CTO, Nebras
  rationale: |
    Bulk/Batch Payments move off `POST /payments` onto their own operations,
    per OFP-001 (approved, decision record DR-2026-001), so that the Ozone
    Connect Bulk and Batch operations mirror the Standards ones in the same
    way the payment operations do: Standards `POST /bulk-payments` maps to
    Ozone Connect `POST /bulk-payments` (`makeBulkPayment`), and Standards
    `GET /bulk-payments/{BulkPaymentId}` to Ozone Connect
    `GET /bulk-payments/{bulkPaymentId}` (`getBulkPayment`), and Standards
    `GET /bulk-payments/{BulkPaymentId}/payments/{PaymentId}` to Ozone
    Connect `GET /bulk-payments/{bulkPaymentId}/payments/{paymentId}`
    (`getBulkPaymentPayment`). All three are additions.

    `PaymentPostRequest.request` on `POST /payments` was a `oneOf` of
    `AEPaymentRequest` and `AEFilePaymentRequest` (the `cbuae-file-payment`
    body). It is now `AEPaymentRequest` only, and the
    `AEPaymentAndFilePaymentRequest` wrapper is removed. `cbuae-file-payment`
    is no longer a payment type on `POST /payments`. oasdiff reports the
    removed `oneOf` branch, and the properties only that branch carried.

    `AEFilePaymentRequest` itself is now the `request` of
    `BulkPaymentPostRequest` on `POST /bulk-payments`. It carries the
    payments as a JSON array instead of referring to an uploaded file: a
    required `Instructions` array, one `AEFilePaymentInstruction` per
    payment and at most 500 payments (`maxItems: 500`, also on the
    response's `instructions`), and no `OpenFinanceBilling`.
    `PaymentPurposeCode` (required)
    and `DebtorReference` sit on each instruction, with `CreditorReference`
    and the per-payment `PersonalIdentifiableInformation`, whose decoded
    form (`AEBankServiceInitiation.AEFilePaymentPIIProperties`) holds a
    required `DebtorAccount`, as the payments may be made from different
    accounts, and the Creditor, without `ConfirmationOfPayeeResponse`. The
    Bulk and Batch Risk block (`AEBulkBatchPaymentRisk`) is carried once, in
    `Data.PersonalIdentifiableInformation`
    (`AEBankServiceInitiation.AEFilePaymentRiskPIIProperties`).

    The response to a Bulk/Batch Payment changes with it. On `POST /payments`
    it was the single-payment `AEPaymentIdResponse`, with one `data.id`. On
    `POST /bulk-payments` and `GET /bulk-payments/{bulkPaymentId}` it is
    `AEFilePaymentIdResponse`, the camelCase mirror of the Standards
    response: `data.id` for the Bulk/Batch Payment and one
    `AEFilePaymentInstructionResponse` per payment, each with its own
    `paymentId`, `status`, `statusUpdateDateTime`, `paymentRail` and
    `rejectReasonCode`. Each payment is validated, screened and settled on
    its own, so one failed payment is `Rejected` without failing the rest.
    A single payment within a Bulk/Batch Payment can still be read with
    `GET /payments/{paymentId}`, in the single-payment shape.

    Acceptance rationale: no LFI has implemented File Payments, so no LFI
    receives the `cbuae-file-payment` body on `POST /payments`, or returns a
    response to it, today.

    Impact: none in production.
